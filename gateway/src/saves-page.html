<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>正在帶上存檔｜家寶數位文化中心</title>
<style>
  html, body { height: 100%; margin: 0; }
  body { display: grid; place-items: center; background: #fff; color: #0b0b0d;
    font-family: Archivo, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif; }
  main { width: min(34rem, 100% - 2rem); padding: 2rem; background: #f0eafc; border-top: 3px solid #0b0b0d; box-sizing: border-box; }
  .k { margin: 0 0 1rem; font-size: .8125rem; font-weight: 700; letter-spacing: .08em; }
  h1 { margin: 0 0 .75rem; font-size: 1.75rem; line-height: 1.2; font-weight: 900; }
  p { margin: 0; line-height: 1.7; }
  a { color: inherit; font-weight: 700; }
</style>
</head>
<body>
<main>
  <p class="k">家寶數位文化中心</p>
  <h1>正在帶上存檔</h1>
  <p>遊戲已搬到 lijiabao.uk。正在把這個瀏覽器在舊網址的進度帶過來，只需要一下子。</p>
  <noscript><p>這一步需要 JavaScript。<a href="%SKIP%">直接進入遊戲</a></p></noscript>
</main>
<script>
// The first time a browser opens a game on lijiabao.uk it passes through this page.
// It asks the old address for its saves (save-export.html there), copies in whatever is not
// already here, and goes on to the game. If the old address does not answer in time, the
// game opens anyway and the copy is tried again later.
(() => {
  const cfg = %CFG%;
  const go = (how) =>
    location.replace(cfg.base + '__saves/' + how + '?to=' + encodeURIComponent(cfg.to) + location.hash);

  const restoreDb = (d) =>
    new Promise((resolve, reject) => {
      const open = indexedDB.open(d.name, d.version);
      open.onupgradeneeded = () => {
        for (const s of d.stores) {
          const store = open.result.createObjectStore(s.name, { keyPath: s.keyPath, autoIncrement: s.autoIncrement });
          for (const i of s.indexes) store.createIndex(i.name, i.keyPath, { unique: i.unique, multiEntry: i.multiEntry });
        }
      };
      open.onerror = () => reject(open.error);
      open.onblocked = () => reject(new Error('blocked'));
      open.onsuccess = () => {
        const db = open.result;
        const filled = d.stores.filter((s) => s.records.length);
        if (!filled.length) return db.close(), resolve();
        const tx = db.transaction(filled.map((s) => s.name), 'readwrite');
        for (const s of filled) {
          const store = tx.objectStore(s.name);
          for (const [key, value] of s.records) s.keyPath === null ? store.put(value, key) : store.put(value);
        }
        tx.oncomplete = () => (db.close(), resolve());
        tx.onabort = tx.onerror = () => (db.close(), reject(tx.error));
      };
    });

  const bringOver = async (data) => {
    for (const [key, value] of Object.entries(data.ls || {})) {
      try {
        if (localStorage.getItem(key) === null) localStorage.setItem(key, value);
      } catch (e) {
        // storage full or blocked: keep going with the rest
      }
    }
    if (!data.idb || !data.idb.length || !indexedDB.databases) return;
    const here = new Set((await indexedDB.databases()).map((d) => d.name));
    for (const d of data.idb) {
      if (here.has(d.name)) continue; // a save already made here wins
      try {
        await restoreDb(d);
      } catch (e) {
        try {
          indexedDB.deleteDatabase(d.name); // never leave half a database behind
        } catch (e2) {}
      }
    }
  };

  let settled = false;
  const frame = document.createElement('iframe');
  const timer = setTimeout(() => {
    if (!settled) (settled = true), go('skip');
  }, cfg.wait);

  addEventListener('message', (e) => {
    if (settled || e.origin !== cfg.from || e.source !== frame.contentWindow) return;
    if (!e.data || e.data.type !== 'lj-saves') return;
    settled = true;
    clearTimeout(timer);
    bringOver(e.data).then(
      () => go('done'),
      () => go('skip'),
    );
  });

  frame.hidden = true;
  frame.src = cfg.from + cfg.exportPath;
  document.body.appendChild(frame);
})();
</script>
</body>
</html>
